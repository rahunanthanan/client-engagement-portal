# Only the OpenShift router may reach the pods; the static server makes no outbound calls.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: client-engagement-portal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: client-engagement-portal
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - port: 8080
  egress: []
