# Static SPA server. Security headers are set here because there is no application server.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Hashed assets never change: cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri =404;
    }

    # Never cache the entry point or the service worker, so a deployment takes effect immediately.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }
    location = /mockServiceWorker.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # Source maps are stripped from the image; refuse them anyway as defence in depth.
    location ~* \.map$ {
        return 404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Client-side routes fall back to index.html.
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri /index.html;
    }

    # In "http" API mode a real deployment would route /api to a backend-for-frontend here
    # (or at the OpenShift Route / ingress). Not part of this sample.
    # location /api/ { proxy_pass http://cep-bff:8080; }
}
