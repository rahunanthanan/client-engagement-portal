# SonarQube / SonarCloud analysis settings. ILLUSTRATIVE: the server URL and token come from the CI
# environment (Jenkins `withSonarQubeEnv` + the `sonarqube-token` credential), never from this file.
sonar.projectKey=client-engagement-portal
sonar.projectName=Client Engagement Portal (sample)
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src,e2e
sonar.test.inclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx,e2e/**/*.spec.ts
sonar.exclusions=src/mocks/**,src/test/**,**/*.d.ts,src/features/workflow/definitions/**
sonar.coverage.exclusions=src/main.tsx,src/mocks/**,src/test/**,src/features/workflow/**,src/**/*.example.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.json
